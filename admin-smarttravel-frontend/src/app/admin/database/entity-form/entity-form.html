<div class="form-container">
  <div class="form-header">
    <h1 class="form-title">{{ formattedTitle }}</h1>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-content">
    <div class="form-fields">
      @for (field of fields; track field.name) {
        <div class="form-group">
          @if (field.type === 'textarea') {
            <textarea
              [formControlName]="field.name"
              class="form-input"
              placeholder="Enter {{ field.label | lowercase }}"
            ></textarea>
          } @else {
            <input
              [type]="field.type"
              [formControlName]="field.name"
              class="form-input"
              [placeholder]="'Enter ' + (field.label | lowercase)"
              [required]="field.required"
            />
          }
          @if (form.get(field.name)?.invalid && form.get(field.name)?.touched) {
            <span class="error-message">{{ field.label }} is required</span>
          }
        </div>
      }
    </div>

    <div class="form-actions">
      <button type="button" class="cancel-btn" (click)="onCancel()">Cancel</button>
      <button type="submit" class="submit-btn" [disabled]="form.invalid">Submit</button>
    </div>
  </form>
</div>
